<!-- Articles Section -->
<section id="articles" class="py-12 md:py-16">
  <div class="container mx-auto px-4">
    <div class="text-center mb-10">
      <h2 class="text-3xl font-bold text-green-700">Nejnovější články</h2>
      <p class="text-gray-600">Aktuální informace ze světa bažantů</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 place-items-center">
      {% for article in latest_articles %}
        {% include "articles/article_card.html" with article=article only %}
      {% empty %}
        <p class="text-gray-600">Články připravujeme.</p>
      {% endfor %}
    </div>
    <div class="text-center mt-10"><a href="{% url 'article_list' %}" class="inline-block px-8 py-3 text-lg bg-green-600 text-white rounded-full hover:bg-green-700 transition shadow-sm">Všechny články →</a></div>
  </div>
</section>
